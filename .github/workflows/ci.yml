name: StreamBridge CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-and-repo-tests:
    name: Python Gates (G1-G3, Security, Non-Windows) & Repo Builder (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest suite (Gates G1, G2, G3, Non-Windows Fallbacks, Security)
        run: pytest

      - name: Build and verify Kodi Add-on Repository structure
        run: python scripts/build_kodi_repo.py

  windows-native-player:
    name: Windows C++20 StreamBridge.Player (Gates G4-G5 & IPC Integration)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Configure StreamBridge.Player with CMake
        run: cmake -S player -B player/build -A x64

      - name: Build StreamBridge.Player (Release)
        run: cmake --build player/build --config Release

      - name: Run StreamBridge.Player self-test & hardware diagnostics
        run: .\player\build\Release\StreamBridge.Player.exe --self-test

      - name: Run full pytest suite including live Named Pipe C++ IPC test
        run: pytest

      - name: Package Kodi Repository & Player Artifacts
        run: python scripts/build_kodi_repo.py

      - name: Upload StreamBridge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streambridge-windows-x64-bundle
          path: |
            dist/
            player/build/Release/StreamBridge.Player.exe
