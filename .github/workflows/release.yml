name: Publish Kodi Repository

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-kodi-repo
  cancel-in-progress: false

jobs:
  publish-kodi-repo:
    name: Build & Publish StreamBridge Kodi Repository
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & run tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest

      - name: Build StreamBridge.Player.exe (Release x64)
        run: |
          cmake -S player -B player/build -A x64
          cmake --build player/build --config Release
          .\player\build\Release\StreamBridge.Player.exe --self-test

      - name: Bundle StreamBridge.Player.exe and StreamBridge.Overlay.dll into plugin.video.streambridge
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "addons/plugin.video.streambridge/bin" | Out-Null
          Copy-Item -Force "player/build/Release/StreamBridge.Player.exe" "addons/plugin.video.streambridge/bin/StreamBridge.Player.exe"
          if (Test-Path "player/build/Release/StreamBridge.Overlay.dll") {
            Copy-Item -Force "player/build/Release/StreamBridge.Overlay.dll" "addons/plugin.video.streambridge/bin/StreamBridge.Overlay.dll"
          }

      - name: Build Kodi Repository (addons.xml, addons.xml.md5, .zip, .sha256)
        run: python scripts/build_kodi_repo.py

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release_assets" | Out-Null
          Copy-Item -Force "dist/repository.streambridge.zip" "release_assets/"
          Copy-Item -Force "player/build/Release/StreamBridge.Player.exe" "release_assets/"
          if (Test-Path "player/build/Release/StreamBridge.Overlay.dll") {
            Copy-Item -Force "player/build/Release/StreamBridge.Overlay.dll" "release_assets/"
          }
          Get-ChildItem -Path "dist/repo" -Recurse -Include "*.zip","*.sha256","addons.xml","addons.xml.md5" | ForEach-Object {
            Copy-Item -Force $_.FullName "release_assets/"
          }

      - name: Create GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $TagName = "${{ github.ref_name }}"
          $Files = Get-ChildItem -Path "release_assets/*" | Select-Object -ExpandProperty FullName
          gh release view $TagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $TagName $Files --clobber
          } else {
            gh release create $TagName $Files --title "StreamBridge $TagName" --generate-notes
          }

      - name: Publish static Kodi repository to repo branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          WORK_TMP=$(mktemp -d)
          if git fetch origin repo:refs/remotes/origin/repo 2>/dev/null; then
            git archive origin/repo | tar -x -C "$WORK_TMP"
          fi
          cp -rf dist/* "$WORK_TMP/"
          git checkout --orphan repo-temp
          git rm -rf .
          git clean -fdx
          cp -rf "$WORK_TMP/"* .
          git add -f repo repository.streambridge.zip
          git commit -m "Publish Kodi repository artifacts (${GITHUB_SHA::7})"
          git push origin HEAD:refs/heads/repo --force
