[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streambridge-core"
version = "0.1.0"
description = "Kodi-native subscription streaming library integration and playback broker"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["addons/script.module.streambridge/lib"]

[tool.setuptools.package-data]
"streambridge_core.providers" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = [
    "addons/script.module.streambridge/lib",
    "addons/plugin.video.streambridge",
    "addons/service.streambridge",
]
testpaths = ["tests"]
addopts = "-v"
