[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streambridge-core"
version = "0.1.3"
description = "Kodi-native subscription streaming library integration and playback broker"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["addons/script.module.streambridge/lib"]

[tool.setuptools.package-data]
"streambridge_core.providers" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "addons/script.module.streambridge/lib",
    "addons/plugin.video.streambridge",
    "addons/service.streambridge",
]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [".reference", "dist", "build", "player"]

[tool.ruff.lint]
# E/F: pycodestyle & pyflakes, B: bugbear, S: bandit security checks, UP: pyupgrade
select = ["E", "F", "B", "S", "UP"]
ignore = [
    "E501",  # Line length handled pragmatically
    "S101",  # Asserts used in tests and internal invariants
    "S314",  # ElementTree used on trusted local NFOs and addon.xml files
    "S324",  # MD5 required by Kodi repository specification for addons.xml.md5 alongside SHA-256
    "S603",  # Subprocess invoked with validated binary and shell=False
]

[tool.mypy]
python_version = "3.10"
mypy_path = [
    "addons/script.module.streambridge/lib",
    "addons/plugin.video.streambridge",
    "addons/service.streambridge",
]
files = [
    "addons/script.module.streambridge/lib/streambridge_core",
    "addons/plugin.video.streambridge/default.py",
    "addons/service.streambridge/service.py",
    "scripts/build_kodi_repo.py",
]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = false
